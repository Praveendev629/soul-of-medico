<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Nav Design</title>
    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
<div class="navigation">
	<ul class="listWrap">
		<li class="list">
			<a href="javascript:void(0);">
				<i class="icon">
					<ion-icon name="clipboard-outline"></ion-icon>
				</i>
				<span class="text">Mocktest</span>
			</a>
		</li>
		<li class="list">
			<a href="javascript:void(0);">
				<i class="icon">
					<ion-icon name="document-outline"></ion-icon>
				</i>
				<span class="text">Notes</span>
			</a>
		</li>
		<li class="list active">
			<a href="javascript:void(0);">
				<i class="icon">
					<ion-icon name="home-outline"></ion-icon>
				</i>
				<span class="text">Home</span>
			</a>
		</li>
		<li class="list">
			<a href="javascript:void(0);">
				<i class="icon">
					<ion-icon name="bulb-outline"></ion-icon>
				</i>
				<span class="text">AI</span>
			</a>
		</li>
		<li class="list">
			<a href="javascript:void(0);">
				<i class="icon">
					<ion-icon name="help-circle-outline"></ion-icon>
				</i>
				<span class="text">Contact</span>
			</a>
		</li>
		<li class="indicator"></li>
	</ul>
</div>

<style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500&display=swap');

html {
  font-size: 62.5%;
}

* {
	padding: 0;
	margin: 0;
	box-sizing: border-box;
	font-family: 'Poppins', sans-serif;
	font-size: 1.4rem;
	-webkit-tap-highlight-color: transparent;
}

:root {
	--bg-default: #222327;
	--primary-white: #ffffff;
	--primary-red: #081ccd;
}

body {
	display: flex;
	justify-content: center;
	align-items: center;
	min-height: 100vh;
	background: var(--bg-default);
}

.navigation {
	width: 360px;
	height: 70px;
	background: var(--primary-white);
	position: relative;
	display: flex;
	justify-content: center;
	align-items: center;
	border-radius: 10px;
	padding: 0 20px;
	.listWrap {
		list-style: none;
		display: flex;
		justify-content: space-between;
		width: 100%;
		li {
			width: 70px;
			height: 70px;
			position: relative;
			z-index: 1;
			a {
				text-decoration: none;
				position: relative;
				display: flex;
				justify-content: center;
				align-items: center;
				flex-direction: column;
				text-align: center;
				font-weight: 500;
				width: 100%;
				&:hover {
					text-decoration: none;
				}
				.icon {
					position: relative;
					display: block;
					line-height: 75px;
					text-align: center;
					transition: 0.5s;
					color: var(--bg-default);
					ion-icon {
						font-size: 2.2rem;
					}
				}
				.text {
					position: absolute;
					color: var(--bg-default);
					font-weight: 400;
					letter-spacing: 0.05em;
					transition: 0.5s;
					transform: translateY(20px);
					opacity: 0;
					z-index: 1;
				}
			}
			&:active, &.active {
				a {
					.icon {
						color: var(--primary-white);
						transform: translateY(-32px);
					}
					.text {
						opacity: 1;
						transform: translateY(10px);
					}
				}
			}
			&.indicator {
				position: absolute;
				width: 70px;
				height: 70px;
				top: -50%;
				border-radius: 50%;
				border: 6px solid var(--bg-default);
				background: var(--primary-red);
				transition: 0.3s;
				z-index: 0;
				&:before, &:after {
					content: '';
					position: absolute;
					top: 50%;
					width: 20px;
					height: 20px;
					background: blue;
					background: transparent;
				}
				&:after {
					right: -22px;
					box-shadow: -1px -10px 0 0 var(--bg-default);
					border-top-left-radius: 20px;
				}
				&:before {
					left: -22px;
					box-shadow: 1px -10px 0 0 var(--bg-default);
					border-top-right-radius: 20px;
				}
			}
			&:nth-child(1).active ~ .indicator {
				transform: translateX(calc(70px * 0));
			}
			&:nth-child(2).active ~ .indicator {
				transform: translateX(calc(70px * 1 + (6px * 2)));
			}
			&:nth-child(3).active ~ .indicator {
				transform: translateX(calc(70px * 2 + (6px * 4) + 1px));
			}
			&:nth-child(4).active ~ .indicator {
				transform: translateX(calc(70px * 3 + (6px * 6) + 2px));
			}
		}
	}
}</style>

<script>const listItem = document.querySelectorAll('.list');

function activateLink() {
	listItem.forEach( item => {
		item.classList.remove('active');
	});
	this.classList.add('active');
}

listItem.forEach( item => {
	item.addEventListener('click', activateLink);
});
</script>
</body>
</html>
