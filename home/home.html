<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul of Medico - Home</title>
    <meta name="description" content="Your signed-in dashboard for Soul of Medico">
    <link rel="icon" type="image/jpeg" href="../assets/logo.jpeg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 50%, #93c5fd 100%);
            min-height: 100vh;
        }

        body:not(.home-page) .profile-bar {
            display: none !important;
        }

        .profile-bar {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1100;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            max-width: calc(100% - 2rem);
        }

        .profile-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255,255,255,0.95);
            border: 1px solid rgba(15,23,42,0.1);
            color: #0f172a;
            padding: 0.8rem 1rem;
            border-radius: 999px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(15,23,42,0.08);
            transition: all 0.2s ease;
        }

        .profile-button:hover {
            background: rgba(255,255,255,1);
            box-shadow: 0 16px 40px rgba(15,23,42,0.12);
        }

        .profile-panel {
            width: 320px;
            max-width: 100%;
            background: rgba(255,255,255,0.98);
            border: 1px solid rgba(15,23,42,0.08);
            border-radius: 1rem;
            box-shadow: 0 20px 50px rgba(15,23,42,0.12);
            padding: 1.25rem;
            transition: transform 0.25s ease, opacity 0.25s ease;
            transform: translateY(-10px);
            opacity: 0;
            pointer-events: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 0.5rem;
        }

        .profile-panel.open {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .profile-panel h2 {
            margin-bottom: 0.75rem;
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
        }

        .profile-panel p, .profile-panel label {
            color: #334155;
            font-size: 0.95rem;
        }

        .profile-panel .field {
            margin-bottom: 0.85rem;
        }

        .profile-panel input {
            width: 100%;
            border: 1px solid rgba(15,23,42,0.12);
            border-radius: 0.75rem;
            padding: 0.85rem 1rem;
            font-size: 0.95rem;
            color: #0f172a;
            background: #f8fafc;
            outline: none;
        }

        .profile-panel input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.1);
        }

        .profile-panel .info-text {
            margin-bottom: 1rem;
            color: #475569;
        }

        .profile-panel .actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .profile-panel .actions button {
            flex: 1 1 48%;
            border: none;
            border-radius: 0.85rem;
            padding: 0.85rem 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        .profile-panel .actions .save-btn {
            background: #2563eb;
            color: white;
        }

        .profile-panel .actions .logout-btn {
            background: #f8fafc;
            color: #0f172a;
            border: 1px solid rgba(15,23,42,0.12);
        }

        .profile-panel .status {
            margin-top: 0.75rem;
            font-size: 0.9rem;
            color: #16a34a;
        }

        /* Content transition */
        #app-content {
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        #app-content.fade-out {
            opacity: 0;
        }

        #app-content.fade-in {
            opacity: 1;
        }

        @media (max-width: 640px) {
            .profile-bar {
                right: 0.75rem;
                left: 0.75rem;
                top: 0.75rem;
            }

            .profile-panel {
                width: 100%;
                right: -0.75rem;
            }
        }
    </style>
   
</head>
<body class="bg-blue-50 text-blue-900 min-h-screen pb-24 home-page">
    <!-- Firebase Auth Check -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="../firebase-config.js"></script>
    <script>
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = '../signin.html';
            }
        });
    </script>

    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <!-- Profile Bar -->
    <div class="profile-bar">
        <button class="profile-button" id="profileBtn">
            <span>👤</span>
            <span id="profileName">Profile</span>
        </button>
        <div class="profile-panel" id="profilePanel" aria-hidden="true">
            <h2>My Profile</h2>
            <div class="field">
                <label>Nickname / Username</label>
                <input type="text" id="displayNameInput" placeholder="Enter your name">
            </div>
            <div class="field">
                <label>Email</label>
                <input type="text" id="emailField" disabled>
            </div>
            <div class="info-text">
                Your email address cannot be changed here.
            </div>
            <div class="actions">
                <button class="save-btn" id="saveProfileBtn">Save</button>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
            <div class="status" id="profileStatus"></div>
        </div>
    </div>

    <!-- Navigation Bar -->
    <style>
        body{
            padding-bottom:90px;
            opacity: 1;
        }

        .navigation{
            position:fixed;
            bottom:0;
            left:0;
            width:100%;
            height:80px;
            background:#fff;
            display:flex;
            justify-content:center;
            align-items:center;
            box-shadow:0 -5px 20px rgba(0,0,0,0.08);
            z-index:1000;
            backdrop-filter: blur(10px);
        }

        .navigation ul{
            display:flex;
            width:100%;
            max-width:500px;
            position:relative;
            padding:0;
            margin:0;
        }

        .navigation ul li{
            list-style:none;
            position:relative;
            width:20%;
            height:70px;
            z-index:1;
        }

        .navigation ul li a{
            position:relative;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            width:100%;
            text-decoration:none;
            cursor: pointer;
            user-select: none;
        }

        .navigation ul li a .icon{
            position:relative;
            display:block;
            line-height:75px;
            font-size:24px;
            text-align:center;
            transition: color 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            color:#2563eb;
            will-change: transform, color;
        }

        .navigation ul li a .text{
            position:absolute;
            font-size:11px;
            font-weight:600;
            color:#2563eb;
            transform:translateY(20px);
            opacity:0;
            transition: opacity 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: opacity, transform;
            pointer-events: none;
        }

        .navigation ul li.active a .icon{
            color:#fff;
            transform:translateY(-32px);
        }

        .navigation ul li.active a .text{
            opacity:1;
            transform:translateY(10px);
        }

        .indicator{
            position:absolute;
            top:-35px;
            width:70px;
            height:70px;
            background:#2563eb;
            border-radius:50%;
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.3);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform;
        }
    </style>

    <div class="navigation">
        <ul>
            <li class="list active">
                <a href="#" data-page="home">
                    <span class="icon"><ion-icon name="home-outline"></ion-icon></span>
                    <span class="text">HOME</span>
                </a>
            </li>
            <li class="list">
                <a href="#" data-page="mocktest">
                    <span class="icon"><ion-icon name="create-outline"></ion-icon></span>
                    <span class="text">TEST</span>
                </a>
            </li>
            <li class="list">
                <a href="#" data-page="notes">
                    <span class="icon"><ion-icon name="document-text-outline"></ion-icon></span>
                    <span class="text">NOTES</span>
                </a>
            </li>
            <li class="list">
                <a href="#" data-page="ai">
                    <span class="icon"><ion-icon name="chatbubbles-outline"></ion-icon></span>
                    <span class="text">AI</span>
                </a>
            </li>
            <li class="list">
                <a href="#" data-page="contact">
                    <span class="icon"><ion-icon name="call-outline"></ion-icon></span>
                    <span class="text">CONTACT</span>
                </a>
            </li>
            <div class="indicator"></div>
        </ul>
    </div>

    <!-- Main Content Area -->
    <div id="app-content">
        <!-- Content loads here dynamically -->
    </div>

    <!-- SPA Router Script -->
    <script>
        const list = document.querySelectorAll('.list');
        const indicator = document.querySelector('.indicator');
        const appContent = document.getElementById('app-content');
        let isAnimating = false;
        let currentPage = 'home';

        // Page content mapping
        const pages = {
            home: 'home.html',
            mocktest: 'mocktest.html',
            notes: 'notes.html',
            ai: 'ai.html',
            contact: 'contact.html'
        };

        // Load page content dynamically
        async function loadPageContent(page) {
            try {
                const response = await fetch(`/home/${pages[page]}`);
                if (!response.ok) throw new Error('Failed to load page');
                
                let html = await response.text();
                
                // Extract only the body content (remove nav and scripts)
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // Get main content (everything except nav)
                let content = '';
                const body = doc.body;
                
                // Get all elements except navigation
                body.querySelectorAll('*').forEach(el => {
                    if (!el.classList.contains('navigation') && 
                        !el.closest('.navigation') &&
                        el.tagName !== 'SCRIPT') {
                        if (!el.parentElement?.classList.contains('navigation')) {
                            content = body.innerHTML;
                        }
                    }
                });
                
                // Fallback: take everything before navigation
                const navIndex = html.indexOf('<div class="navigation">');
                if (navIndex > 0) {
                    content = html.substring(0, navIndex);
                }
                
                return content;
            } catch (error) {
                console.error('Error loading page:', error);
                return '<div class="p-8 text-center text-red-600">Error loading page</div>';
            }
        }

        // Set indicator position instantly
        function setIndicatorPositionInstant(el) {
            const index = Array.from(list).indexOf(el);
            const translateX = index * 100;
            indicator.style.transition = 'none';
            indicator.style.transform = `translateX(calc(${translateX}% + ${(el.offsetWidth/2 - 35)}px))`;
            void indicator.offsetHeight;
            setTimeout(() => {
                indicator.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
            }, 50);
        }

        // Set indicator position with animation
        function setIndicatorPositionAnimated(el) {
            const index = Array.from(list).indexOf(el);
            const translateX = index * 100;
            indicator.style.transform = `translateX(calc(${translateX}% + ${(el.offsetWidth/2 - 35)}px))`;
        }

        // Navigate to page
        async function navigateToPage(page) {
            if (isAnimating || currentPage === page) return;

            isAnimating = true;

            // Update active nav
            list.forEach(item => {
                const itemPage = item.querySelector('a').dataset.page;
                if (itemPage === page) {
                    item.classList.add('active');
                    setIndicatorPositionAnimated(item);
                } else {
                    item.classList.remove('active');
                }
            });

            // Fade out current content
            appContent.classList.add('fade-out');

            setTimeout(async () => {
                // Load new content
                const content = await loadPageContent(page);
                appContent.innerHTML = content;
                currentPage = page;

                // Update URL
                window.history.pushState({ page }, page, `#${page}`);

                // Re-init ionicons for new content
                if (window.ionicons) {
                    window.ionicons.loadIcons();
                }

                // Fade in new content
                appContent.classList.remove('fade-out');
                appContent.classList.add('fade-in');
                
                setTimeout(() => {
                    appContent.classList.remove('fade-in');
                }, 300);

                isAnimating = false;
            }, 150);
        }

        // Nav click handler
        list.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                const page = item.querySelector('a').dataset.page;
                navigateToPage(page);
            });
        });

        // Handle browser back/forward
        window.addEventListener('popstate', (e) => {
            if (e.state && e.state.page) {
                navigateToPage(e.state.page);
            }
        });

        // Load initial page on mount
        window.addEventListener('DOMContentLoaded', async () => {
            const hash = window.location.hash.substring(1) || 'home';
            if (pages[hash]) {
                currentPage = hash;
                const content = await loadPageContent(hash);
                appContent.innerHTML = content;
                
                // Set active nav
                list.forEach(item => {
                    const itemPage = item.querySelector('a').dataset.page;
                    if (itemPage === hash) {
                        item.classList.add('active');
                        setIndicatorPositionInstant(item);
                    } else {
                        item.classList.remove('active');
                    }
                });

                if (window.ionicons) {
                    window.ionicons.loadIcons();
                }
            }
        });
    </script>

    <!-- Profile Management -->
    <script>
        const profileBtn = document.getElementById('profileBtn');
        const profilePanel = document.getElementById('profilePanel');
        const displayNameInput = document.getElementById('displayNameInput');
        const emailField = document.getElementById('emailField');
        const saveProfileBtn = document.getElementById('saveProfileBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const profileStatus = document.getElementById('profileStatus');
        const profileName = document.getElementById('profileName');

        auth.onAuthStateChanged((user) => {
            if (!user) return;
            displayNameInput.value = user.displayName || '';
            emailField.value = user.email || '';
            profileName.textContent = user.displayName || 'Profile';
        });

        function openProfilePanel() {
            profilePanel.classList.add('open');
            profilePanel.setAttribute('aria-hidden', 'false');
        }

        function closeProfilePanel() {
            profilePanel.classList.remove('open');
            profilePanel.setAttribute('aria-hidden', 'true');
        }

        profileBtn.addEventListener('click', () => {
            if (profilePanel.classList.contains('open')) {
                closeProfilePanel();
                return;
            }
            openProfilePanel();
        });

        window.addEventListener('click', (event) => {
            if (!profilePanel.contains(event.target) && !profileBtn.contains(event.target)) {
                closeProfilePanel();
            }
        });

        saveProfileBtn.addEventListener('click', async () => {
            const user = auth.currentUser;
            if (!user) {
                profileStatus.textContent = 'No authenticated user found.';
                return;
            }

            const newName = displayNameInput.value.trim();
            if (!newName) {
                profileStatus.textContent = 'Please enter a valid name.';
                profileStatus.style.color = '#b91c1c';
                return;
            }

            try {
                await user.updateProfile({ displayName: newName });
                profileName.textContent = newName;
                profileStatus.textContent = 'Profile updated successfully.';
                profileStatus.style.color = '#16a34a';
            } catch (error) {
                console.error('Profile update failed:', error);
                profileStatus.textContent = 'Unable to save profile.';
                profileStatus.style.color = '#b91c1c';
            }
        });

        logoutBtn.addEventListener('click', async () => {
            try {
                await auth.signOut();
                window.location.href = '../signin.html';
            } catch (error) {
                console.error('Log out failed:', error);
                profileStatus.textContent = 'Unable to sign out.';
                profileStatus.style.color = '#b91c1c';
            }
        });
    </script>
</body>
</html>
