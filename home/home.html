<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul of Medico - Home</title>
    <meta name="description" content="Your signed-in dashboard for Soul of Medico">
    <link rel="icon" type="image/jpeg" href="../assets/logo.jpeg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 50%, #93c5fd 100%);
            min-height: 100vh;
        }

        .profile-bar {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1100;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            max-width: calc(100% - 2rem);
        }

        .profile-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255,255,255,0.95);
            border: 1px solid rgba(15,23,42,0.1);
            color: #0f172a;
            padding: 0.8rem 1rem;
            border-radius: 999px;
            font-weight: 600;
            box-shadow: 0 12px 30px rgba(15,23,42,0.08);
            cursor: pointer;
        }

        .profile-panel {
            width: 320px;
            max-width: 100%;
            background: rgba(255,255,255,0.98);
            border: 1px solid rgba(15,23,42,0.08);
            border-radius: 1rem;
            box-shadow: 0 20px 50px rgba(15,23,42,0.12);
            padding: 1.25rem;
            transition: transform 0.25s ease, opacity 0.25s ease;
            transform: translateY(-10px);
            opacity: 0;
            pointer-events: none;
        }

        .profile-panel.open {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .profile-panel h2 {
            margin-bottom: 0.75rem;
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
        }

        .profile-panel p,
        .profile-panel label {
            color: #334155;
            font-size: 0.95rem;
        }

        .profile-panel .field {
            margin-bottom: 0.85rem;
        }

        .profile-panel input {
            width: 100%;
            border: 1px solid rgba(15,23,42,0.12);
            border-radius: 0.75rem;
            padding: 0.85rem 1rem;
            font-size: 0.95rem;
            color: #0f172a;
            background: #f8fafc;
            outline: none;
        }

        .profile-panel .field input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.1);
        }

        .profile-panel .info-text {
            margin-bottom: 1rem;
            color: #475569;
        }

        .profile-panel .actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .profile-panel .actions button {
            flex: 1 1 48%;
            border: none;
            border-radius: 0.85rem;
            padding: 0.85rem 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        .profile-panel .actions .save-btn {
            background: #2563eb;
            color: white;
        }

        .profile-panel .actions .logout-btn {
            background: #f8fafc;
            color: #0f172a;
            border: 1px solid rgba(15,23,42,0.12);
        }

        .profile-panel .status {
            margin-top: 0.75rem;
            font-size: 0.9rem;
            color: #16a34a;
        }

        @media (max-width: 640px) {
            .profile-bar {
                right: 0.75rem;
                left: 0.75rem;
                top: 0.75rem;
            }

            .profile-panel {
                width: 100%;
            }
        }
    </style>
   
</head>
<body class="bg-blue-50 text-blue-900 min-h-screen pb-24">
    <!-- Firebase Auth Check -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="../firebase-config.js"></script>

        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = '../signin.html';
            }
        });
    </script>

   <!-- Ionicons -->
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

<style>
body{
    padding-bottom:90px;
    opacity: 1;
}

.navigation{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:80px;
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 -5px 20px rgba(0,0,0,0.08);
    z-index:1000;
    backdrop-filter: blur(10px);
}

.navigation ul{
    display:flex;
    width:100%;
    max-width:500px;
    position:relative;
    padding:0;
    margin:0;
}

.navigation ul li{
    list-style:none;
    position:relative;
    width:20%;
    height:70px;
    z-index:1;
}

.navigation ul li a{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    width:100%;
    text-decoration:none;
    cursor: pointer;
    user-select: none;
}

.navigation ul li a .icon{
    position:relative;
    display:block;
    line-height:75px;
    font-size:24px;
    text-align:center;
    transition: color 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    color:#2563eb;
    will-change: transform, color;
}

.navigation ul li a .text{
    position:absolute;
    font-size:11px;
    font-weight:600;
    color:#2563eb;
    transform:translateY(20px);
    opacity:0;
    transition: opacity 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    will-change: opacity, transform;
    pointer-events: none;
}

.navigation ul li.active a .icon{
    color:#fff;
    transform:translateY(-32px);
}

.navigation ul li.active a .text{
    opacity:1;
    transform:translateY(10px);
}

.indicator{
    position:absolute;
    top:-35px;
    width:70px;
    height:70px;
    background:#2563eb;
    border-radius:50%;
    box-shadow: 0 8px 16px rgba(37, 99, 235, 0.3);
    will-change: transform;
}
</style>

<div class="navigation">
    <ul>
        <li class="list active">
            <a href="./home.html" data-page="home">
                <span class="icon"><ion-icon name="home-outline"></ion-icon></span>
                <span class="text">HOME</span>
            </a>
        </li>

        <li class="list">
            <a href="./mocktest.html" data-page="mocktest">
                <span class="icon"><ion-icon name="create-outline"></ion-icon></span>
                <span class="text">TEST</span>
            </a>
        </li>

        <li class="list">
            <a href="./notes.html" data-page="notes">
                <span class="icon"><ion-icon name="document-text-outline"></ion-icon></span>
                <span class="text">NOTES</span>
            </a>
        </li>

        <li class="list">
            <a href="./ai.html" data-page="ai">
                <span class="icon"><ion-icon name="chatbubbles-outline"></ion-icon></span>
                <span class="text">AI</span>
            </a>
        </li>

        <li class="list">
            <a href="./contact.html" data-page="contact">
                <span class="icon"><ion-icon name="call-outline"></ion-icon></span>
                <span class="text">CONTACT</span>
            </a>
        </li>

        <div class="indicator" style="will-change: transform;"></div>
    </ul>
</div>

<script>
const list = document.querySelectorAll('.list');
const indicator = document.querySelector('.indicator');
let isAnimating = false;
let currentIndex = 0;

// Get current page from URL
function getCurrentPageIndex() {
    const currentPage = window.location.pathname.split('/').pop().replace('.html', '') || 'home';
    const pageMap = { 'home': 0, 'mocktest': 1, 'notes': 2, 'ai': 3, 'contact': 4 };
    return pageMap[currentPage] || 0;
}

// Create smooth transition overlay
function createTransitionOverlay() {
    const overlay = document.createElement('div');
    overlay.id = 'page-transition';
    overlay.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 50%, #93c5fd 100%);
        opacity: 0;
        pointer-events: none;
        z-index: 999;
        transition: opacity 0.25s ease-in-out;
    `;
    document.body.appendChild(overlay);
    return overlay;
}

const transitionOverlay = createTransitionOverlay();

// Set indicator position instantly (for initial load)
function setIndicatorPositionInstant(el){
    const index = Array.from(list).indexOf(el);
    const translateX = index * 100;
    indicator.style.transition = 'none';
    indicator.style.transform = `translateX(calc(${translateX}% + ${(el.offsetWidth/2 - 35)}px))`;
    // Force reflow to apply instant change
    void indicator.offsetHeight;
    // Re-enable transition for user interactions
    setTimeout(() => {
        indicator.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
    }, 50);
}

// Set indicator position with animation (for user clicks)
function setIndicatorPositionAnimated(el){
    const index = Array.from(list).indexOf(el);
    const translateX = index * 100;
    indicator.style.transform = `translateX(calc(${translateX}% + ${(el.offsetWidth/2 - 35)}px))`;
}

function setActive(item){
    if(isAnimating) return;
    
    isAnimating = true;
    const newIndex = Array.from(list).indexOf(item);
    
    if(newIndex === currentIndex){
        isAnimating = false;
        return;
    }
    
    list.forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    currentIndex = newIndex;
    setIndicatorPositionAnimated(item);
    
    setTimeout(() => {
        isAnimating = false;
    }, 300);
}

list.forEach((item, index) => {
    item.addEventListener('click', (e) => {
        e.preventDefault();
        setActive(item);
        
        const link = item.querySelector('a');
        if(link && link.href){
            setTimeout(() => {
                transitionOverlay.style.opacity = '1';
                setTimeout(() => {
                    window.location.href = link.href;
                }, 150);
            }, 150);
        }
    });
});

// Initialize on page load
window.addEventListener('DOMContentLoaded', () => {
    currentIndex = getCurrentPageIndex();
    const active = list[currentIndex];
    
    if(active) {
        active.classList.add('active');
        setIndicatorPositionInstant(active);
    }
    
    list.forEach((item, index) => {
        if(index !== currentIndex) {
            item.classList.remove('active');
        }
    });
});

// Smooth page entrance
window.addEventListener('load', () => {
    document.body.style.opacity = '0';
    document.body.style.transition = 'opacity 0.4s ease-in-out';
    
    setTimeout(() => {
        document.body.style.opacity = '1';
        transitionOverlay.style.opacity = '0';
    }, 50);
});
</script>
</body>
</html>
