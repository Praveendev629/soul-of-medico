<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Tests - Soul of Medico</title>
    <link rel="icon" type="image/jpeg" href="../assets/logo.jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/mocktest.css">

<body class="bg-blue-50 text-blue-900 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8">Mock Tests</h1>
        <div class="bg-white rounded-lg shadow-lg p-6">
            <p class="text-lg mb-4">Take practice tests to prepare for NEET.</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="border border-blue-300 rounded-lg p-4">
                    <h3 class="font-semibold">Full Length Test</h3>
                    <p class="text-sm text-gray-600">180 questions, 3 hours.</p>
                    <button class="mt-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Start Test</button>
                </div>
                <div class="border border-blue-300 rounded-lg p-4">
                    <h3 class="font-semibold">Subject Wise Test</h3>
                    <p class="text-sm text-gray-600">Focus on specific subjects.</p>
                    <button class="mt-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Start Test</button>
                </div>
                <div class="border border-blue-300 rounded-lg p-4">
                    <h3 class="font-semibold">Chapter Wise Test</h3>
                    <p class="text-sm text-gray-600">Practice individual chapters.</p>
                    <button class="mt-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Start Test</button>
                </div>
                <div class="border border-blue-300 rounded-lg p-4">
                    <h3 class="font-semibold">Previous Year Papers</h3>
                    <p class="text-sm text-gray-600">Solve past NEET papers.</p>
                    <button class="mt-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Start Test</button>
                </div>
            </div>
        </div>
    </div>
