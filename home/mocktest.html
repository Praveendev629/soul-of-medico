<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Tests - Soul of Medico</title>
    <link rel="icon" type="image/jpeg" href="../assets/logo.jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/mocktest.css">
    <link rel="stylesheet" href="nav.css">
</head>
<body class="bg-blue-50 text-blue-900 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8">Mock Tests</h1>
        <div class="bg-white rounded-lg shadow-lg p-6">
            <p class="text-lg mb-4">Take practice tests to prepare for NEET.</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="border border-blue-300 rounded-lg p-4">
                    <h3 class="font-semibold">Full Length Test</h3>
                    <p class="text-sm text-gray-600">180 questions, 3 hours.</p>
                    <button class="mt-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Start Test</button>
                </div>
                <div class="border border-blue-300 rounded-lg p-4">
                    <h3 class="font-semibold">Subject Wise Test</h3>
                    <p class="text-sm text-gray-600">Focus on specific subjects.</p>
                    <button class="mt-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Start Test</button>
                </div>
                <div class="border border-blue-300 rounded-lg p-4">
                    <h3 class="font-semibold">Chapter Wise Test</h3>
                    <p class="text-sm text-gray-600">Practice individual chapters.</p>
                    <button class="mt-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Start Test</button>
                </div>
                <div class="border border-blue-300 rounded-lg p-4">
                    <h3 class="font-semibold">Previous Year Papers</h3>
                    <p class="text-sm text-gray-600">Solve past NEET papers.</p>
                    <button class="mt-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Start Test</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
        <!-- Ionicons -->
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

<style>
.navigation{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:70px;
    background:#ffffff;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 -5px 15px rgba(0,0,0,0.1);
    z-index:1000;
}

.listWrap{
    list-style:none;
    display:flex;
    justify-content:space-around;
    align-items:center;
    width:100%;
    max-width:600px;
    position:relative;
}

.listWrap li{
    width:70px;
    height:70px;
    position:relative;
    z-index:1;
}

.listWrap li a{
    text-decoration:none;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-weight:500;
    width:100%;
}

.listWrap li a .icon{
    line-height:75px;
    transition:0.4s;
    color:#1e3a8a;
}

.listWrap li a .icon ion-icon{
    font-size:26px;
}

.listWrap li a .text{
    position:absolute;
    font-size:11px;
    font-weight:600;
    color:#1e3a8a;
    transform:translateY(20px);
    opacity:0;
    transition:0.4s;
}

.listWrap li.active a .icon{
    color:white;
    transform:translateY(-30px);
}

.listWrap li.active a .text{
    opacity:1;
    transform:translateY(10px);
}

.indicator{
    position:absolute;
    width:70px;
    height:70px;
    top:-50%;
    left:0;
    border-radius:50%;
    background:#2563eb;
    border:6px solid #dbeafe;
    transition:0.3s;
    z-index:0;
}
</style>

<div class="navigation">
<ul class="listWrap">
    <li class="list">
        <a href="home.html">
            <i class="icon"><ion-icon name="home-outline"></ion-icon></i>
            <span class="text">HOME</span>
        </a>
    </li>

    <li class="list active">
        <a href="mocktest.html">
            <i class="icon"><ion-icon name="create-outline"></ion-icon></i>
            <span class="text">TEST</span>
        </a>
    </li>

    <li class="list">
        <a href="notes.html">
            <i class="icon"><ion-icon name="document-text-outline"></ion-icon></i>
            <span class="text">NOTES</span>
        </a>
    </li>

    <li class="list">
        <a href="ai.html">
            <i class="icon"><ion-icon name="chatbubbles-outline"></ion-icon></i>
            <span class="text">AI</span>
        </a>
    </li>

    <li class="list">
        <a href="contact.html">
            <i class="icon"><ion-icon name="call-outline"></ion-icon></i>
            <span class="text">CONTACT</span>
        </a>
    </li>

    <li class="indicator"></li>
</ul>
</div>

<script>
const listItem = document.querySelectorAll('.list');
const indicator = document.querySelector('.indicator');
const listWrap = document.querySelector('.listWrap');

function updateIndicator(activeItem){
    const wrapRect = listWrap.getBoundingClientRect();
    const itemRect = activeItem.getBoundingClientRect();
    const center = itemRect.left + itemRect.width/2 - wrapRect.left;
    indicator.style.left = (center - indicator.offsetWidth/2) + 'px';
}

function activateLink(){
    listItem.forEach(item => item.classList.remove('active'));
    this.classList.add('active');
    updateIndicator(this);
}

listItem.forEach(item => item.addEventListener('click', activateLink));

window.addEventListener('load', ()=>{
    const active = document.querySelector('.list.active');
    if(active) updateIndicator(active);
});

window.addEventListener('resize', ()=>{
    const active = document.querySelector('.list.active');
    if(active) updateIndicator(active);
});
</script>
</body>
</html>
