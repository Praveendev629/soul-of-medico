<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Tests - Soul of Medico</title>
    <link rel="icon" type="image/jpeg" href="../assets/logo.jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/mocktest.css">
    
    
</head>
<body class="bg-blue-50 text-blue-900 min-h-screen pb-24">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8">Mock Tests</h1>
        <div class="bg-white rounded-lg shadow-lg p-6">
            <p class="text-lg mb-4">Take practice tests to prepare for NEET.</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="border border-blue-300 rounded-lg p-4">
                    <h3 class="font-semibold">Full Length Test</h3>
                    <p class="text-sm text-gray-600">180 questions, 3 hours.</p>
                    <button class="mt-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Start Test</button>
                </div>
                <div class="border border-blue-300 rounded-lg p-4">
                    <h3 class="font-semibold">Subject Wise Test</h3>
                    <p class="text-sm text-gray-600">Focus on specific subjects.</p>
                    <button class="mt-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Start Test</button>
                </div>
                <div class="border border-blue-300 rounded-lg p-4">
                    <h3 class="font-semibold">Chapter Wise Test</h3>
                    <p class="text-sm text-gray-600">Practice individual chapters.</p>
                    <button class="mt-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Start Test</button>
                </div>
                <div class="border border-blue-300 rounded-lg p-4">
                    <h3 class="font-semibold">Previous Year Papers</h3>
                    <p class="text-sm text-gray-600">Solve past NEET papers.</p>
                    <button class="mt-2 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Start Test</button>
                </div>
            </div>
        </div>
    </div>

 <!-- Ionicons -->
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

<style>
body{
    padding-bottom:90px;
}

.navigation{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:80px;
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 -5px 20px rgba(0,0,0,0.08);
    z-index:1000;
}

.navigation ul{
    display:flex;
    width:100%;
    max-width:500px;
    position:relative;
    padding:0;
    margin:0;
}

.navigation ul li{
    list-style:none;
    position:relative;
    width:20%;
    height:70px;
    z-index:1;
}

.navigation ul li a{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    width:100%;
    text-decoration:none;
}

.navigation ul li a .icon{
    position:relative;
    display:block;
    line-height:75px;
    font-size:24px;
    text-align:center;
    transition:0.4s;
    color:#2563eb;
}

.navigation ul li a .text{
    position:absolute;
    font-size:11px;
    font-weight:600;
    color:#2563eb;
    transform:translateY(20px);
    opacity:0;
    transition:0.4s;
}

.navigation ul li.active a .icon{
    color:#fff;
    transform:translateY(-32px);
}

.navigation ul li.active a .text{
    opacity:1;
    transform:translateY(10px);
}

.indicator{
    position:absolute;
    top:-35px;
    width:70px;
    height:70px;
    background:#2563eb;
    border-radius:50%;
    transition:0.4s;
}
</style>

<div class="navigation">
    <ul>
        <li class="list">
            <a href="home.html">
                <span class="icon"><ion-icon name="home-outline"></ion-icon></span>
                <span class="text">HOME</span>
            </a>
        </li>

        <li class="list active">
            <a href="mocktest.html">
                <span class="icon"><ion-icon name="create-outline"></ion-icon></span>
                <span class="text">TEST</span>
            </a>
        </li>

        <li class="list">
            <a href="notes.html">
                <span class="icon"><ion-icon name="document-text-outline"></ion-icon></span>
                <span class="text">NOTES</span>
            </a>
        </li>

        <li class="list">
            <a href="ai.html">
                <span class="icon"><ion-icon name="chatbubbles-outline"></ion-icon></span>
                <span class="text">AI</span>
            </a>
        </li>

        <li class="list">
            <a href="contact.html">
                <span class="icon"><ion-icon name="call-outline"></ion-icon></span>
                <span class="text">CONTACT</span>
            </a>
        </li>

        <div class="indicator"></div>
    </ul>
</div>

<script>
const list = document.querySelectorAll('.list');
const indicator = document.querySelector('.indicator');

function updateIndicator(el){
    indicator.style.left = el.offsetLeft + (el.offsetWidth/2 - 35) + "px";
}

list.forEach(item=>{
    item.addEventListener('click',function(){
        list.forEach(i=>i.classList.remove('active'));
        this.classList.add('active');
        updateIndicator(this);
    });
});

window.addEventListener('load',()=>{
    const active = document.querySelector('.list.active');
    updateIndicator(active);
});
</script>

</body>
</html>
