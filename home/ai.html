<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - Soul of Medico</title>
    <meta name="description" content="AI-powered study assistant for NEET preparation">
    <link rel="icon" type="image/jpeg" href="../assets/logo.jpeg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
body{
    padding-bottom:90px;
}

.navigation{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:80px;
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 -5px 20px rgba(0,0,0,0.08);
    z-index:1000;
    backdrop-filter: blur(10px);
}

.navigation ul{
    display:flex;
    width:100%;
    max-width:500px;
    position:relative;
    padding:0;
    margin:0;
}

.navigation ul li{
    list-style:none;
    position:relative;
    width:20%;
    height:70px;
    z-index:1;
}

.navigation ul li a{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    width:100%;
    text-decoration:none;
    cursor: pointer;
}

.navigation ul li a .icon{
    position:relative;
    display:block;
    line-height:75px;
    font-size:24px;
    text-align:center;
    transition: color 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    color:#2563eb;
    will-change: transform, color;
}

.navigation ul li a .text{
    position:absolute;
    font-size:11px;
    font-weight:600;
    color:#2563eb;
    transform:translateY(20px);
    opacity:0;
    transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: opacity, transform;
    pointer-events: none;
}

.navigation ul li.active a .icon{
    color:#fff;
    transform:translateY(-32px);
}

.navigation ul li.active a .text{
    opacity:1;
    transform:translateY(10px);
}

.indicator{
    position:absolute;
    top:-35px;
    width:70px;
    height:70px;
    background:#2563eb;
    border-radius:50%;
    box-shadow: 0 8px 16px rgba(37, 99, 235, 0.3);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
}
</style>

<div class="navigation">
    <ul>
        <li class="list">
            <a href="./home.html" data-page="home">
                <span class="icon"><ion-icon name="home-outline"></ion-icon></span>
                <span class="text">HOME</span>
            </a>
        </li>

        <li class="list">
            <a href="./mocktest.html" data-page="mocktest">
                <span class="icon"><ion-icon name="create-outline"></ion-icon></span>
                <span class="text">TEST</span>
            </a>
        </li>

        <li class="list">
            <a href="./notes.html" data-page="notes">
                <span class="icon"><ion-icon name="document-text-outline"></ion-icon></span>
                <span class="text">NOTES</span>
            </a>
        </li>

        <li class="list active">
            <a href="./ai.html" data-page="ai">
                <span class="icon"><ion-icon name="chatbubbles-outline"></ion-icon></span>
                <span class="text">AI</span>
            </a>
        </li>

        <li class="list">
            <a href="./contact.html" data-page="contact">
                <span class="icon"><ion-icon name="call-outline"></ion-icon></span>
                <span class="text">CONTACT</span>
            </a>
        </li>

        <div class="indicator" style="will-change: transform;"></div>
    </ul>
</div>

<script>
const list = document.querySelectorAll('.list');
const indicator = document.querySelector('.indicator');
let isAnimating = false;
let currentIndex = 0;

function updateIndicator(el){
    const index = Array.from(list).indexOf(el);
    const translateX = index * 100;
    indicator.style.transform = `translateX(calc(${translateX}% + ${(el.offsetWidth/2 - 35)}px))`;
}

function setActive(item){
    if(isAnimating) return;
    
    isAnimating = true;
    const newIndex = Array.from(list).indexOf(item);
    
    if(newIndex === currentIndex){
        isAnimating = false;
        return;
    }
    
    list.forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    currentIndex = newIndex;
    updateIndicator(item);
    
    // Re-enable after animation
    setTimeout(() => {
        isAnimating = false;
    }, 350);
}

list.forEach((item, index) => {
    item.addEventListener('click', (e) => {
        e.preventDefault();
        setActive(item);
        // Navigate after animation completes
        setTimeout(() => {
            const link = item.querySelector('a');
            if(link && link.href){
                window.location.href = link.href;
            }
        }, 175);
    });
});

// Initialize on load
window.addEventListener('load', () => {
    const active = document.querySelector('.list.active');
    if(active){
        currentIndex = Array.from(list).indexOf(active);
        updateIndicator(active);
    }
});

// Restore active state based on current page
window.addEventListener('load', () => {
    const currentPage = window.location.pathname.split('/').pop().replace('.html', '');
    list.forEach((item, index) => {
        const link = item.querySelector('a').href;
        if(link.includes(currentPage)){
            currentIndex = index;
            item.classList.add('active');
            updateIndicator(item);
        } else {
            item.classList.remove('active');
        }
    });
});
</script>
</body>
</html>
