<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Soul of Medico</title>
    <link rel="icon" type="image/jpeg" href="../assets/logo.jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="nav.css">
    
</head>
<body class="bg-blue-50 text-blue-900 min-h-screen">
    <!-- Firebase Auth Check -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="../firebase-config.js"></script>
    <script>
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = '../signin.html';
            }
        });
    </script>

    <div class="container mx-auto px-4 py-10">
        <h1 class="text-3xl font-bold text-center mb-6">Contact Us</h1>
        <div class="bg-white rounded-xl shadow-lg p-8 max-w-3xl mx-auto">
            <p class="text-lg mb-4">Need help with your NEET prep? Reach out to our team.</p>
            <div class="grid gap-6 md:grid-cols-2">
                <div class="rounded-lg border border-blue-200 p-5">
                    <h2 class="text-xl font-semibold mb-2">Email</h2>
                    <p class="text-blue-700">support@soul-of-medico.com</p>
                </div>
                <div class="rounded-lg border border-blue-200 p-5">
                    <h2 class="text-xl font-semibold mb-2">Phone</h2>
                    <p class="text-blue-700">+91 98765 43210</p>
                </div>
            </div>
            <div class="mt-8">
                <h2 class="text-xl font-semibold mb-3">Message</h2>
                <textarea class="w-full border border-blue-200 rounded-lg p-3 focus:ring-2 focus:ring-blue-300" rows="5" placeholder="Write your message here..."></textarea>
                <button class="mt-4 bg-blue-600 text-white px-5 py-3 rounded-lg hover:bg-blue-700">Send Message</button>
            </div>
        </div>
    </div>

   <!-- Ionicons -->
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

<style>
body{
    padding-bottom:90px;
    opacity: 1;
}

.navigation{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:80px;
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 -5px 20px rgba(0,0,0,0.08);
    z-index:1000;
    backdrop-filter: blur(10px);
}

.navigation ul{
    display:flex;
    width:100%;
    max-width:500px;
    position:relative;
    padding:0;
    margin:0;
}

.navigation ul li{
    list-style:none;
    position:relative;
    width:20%;
    height:70px;
    z-index:1;
}

.navigation ul li a{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    width:100%;
    text-decoration:none;
    cursor: pointer;
    user-select: none;
}

.navigation ul li a .icon{
    position:relative;
    display:block;
    line-height:75px;
    font-size:24px;
    text-align:center;
    transition: color 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    color:#2563eb;
    will-change: transform, color;
}

.navigation ul li a .text{
    position:absolute;
    font-size:11px;
    font-weight:600;
    color:#2563eb;
    transform:translateY(20px);
    opacity:0;
    transition: opacity 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    will-change: opacity, transform;
    pointer-events: none;
}

.navigation ul li.active a .icon{
    color:#fff;
    transform:translateY(-32px);
}

.navigation ul li.active a .text{
    opacity:1;
    transform:translateY(10px);
}

.indicator{
    position:absolute;
    top:-35px;
    width:70px;
    height:70px;
    background:#2563eb;
    border-radius:50%;
    box-shadow: 0 8px 16px rgba(37, 99, 235, 0.3);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    will-change: transform;
}
</style>

<div class="navigation">
    <ul>
        <li class="list">
            <a href="./home.html" data-page="home">
                <span class="icon"><ion-icon name="home-outline"></ion-icon></span>
                <span class="text">HOME</span>
            </a>
        </li>

        <li class="list">
            <a href="./mocktest.html" data-page="mocktest">
                <span class="icon"><ion-icon name="create-outline"></ion-icon></span>
                <span class="text">TEST</span>
            </a>
        </li>

        <li class="list">
            <a href="./notes.html" data-page="notes">
                <span class="icon"><ion-icon name="document-text-outline"></ion-icon></span>
                <span class="text">NOTES</span>
            </a>
        </li>

        <li class="list">
            <a href="./ai.html" data-page="ai">
                <span class="icon"><ion-icon name="chatbubbles-outline"></ion-icon></span>
                <span class="text">AI</span>
            </a>
        </li>

        <li class="list active">
            <a href="./contact.html" data-page="contact">
                <span class="icon"><ion-icon name="call-outline"></ion-icon></span>
                <span class="text">CONTACT</span>
            </a>
        </li>

        <div class="indicator" style="will-change: transform;"></div>
    </ul>
</div>

<script>
const list = document.querySelectorAll('.list');
const indicator = document.querySelector('.indicator');
let isAnimating = false;
let currentIndex = 0;

// Create smooth transition overlay
function createTransitionOverlay() {
    const overlay = document.createElement('div');
    overlay.id = 'page-transition';
    overlay.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 50%, #93c5fd 100%);
        opacity: 0;
        pointer-events: none;
        z-index: 999;
        transition: opacity 0.25s ease-in-out;
    `;
    document.body.appendChild(overlay);
    return overlay;
}

const transitionOverlay = createTransitionOverlay();

function updateIndicator(el){
    const index = Array.from(list).indexOf(el);
    const translateX = index * 100;
    indicator.style.transform = `translateX(calc(${translateX}% + ${(el.offsetWidth/2 - 35)}px))`;
}

function setActive(item){
    if(isAnimating) return;
    
    isAnimating = true;
    const newIndex = Array.from(list).indexOf(item);
    
    if(newIndex === currentIndex){
        isAnimating = false;
        return;
    }
    
    list.forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    currentIndex = newIndex;
    updateIndicator(item);
    
    setTimeout(() => {
        isAnimating = false;
    }, 350);
}

list.forEach((item, index) => {
    item.addEventListener('click', (e) => {
        e.preventDefault();
        setActive(item);
        
        const link = item.querySelector('a');
        if(link && link.href){
            setTimeout(() => {
                transitionOverlay.style.opacity = '1';
                setTimeout(() => {
                    window.location.href = link.href;
                }, 150);
            }, 175);
        }
    });
});

// Smooth page entrance
window.addEventListener('load', () => {
    document.body.style.opacity = '0';
    document.body.style.transition = 'opacity 0.4s ease-in-out';
    
    const active = document.querySelector('.list.active');
    if(active){
        currentIndex = Array.from(list).indexOf(active);
        updateIndicator(active);
    }
    
    // Fade in page
    setTimeout(() => {
        document.body.style.opacity = '1';
        transitionOverlay.style.opacity = '0';
    }, 50);
});

// Auto-detect current page
const currentPage = window.location.pathname.split('/').pop().replace('.html', '') || 'home';
list.forEach((item, index) => {
    const link = item.querySelector('a');
    const page = link.getAttribute('data-page');
    if(page === currentPage || (currentPage === '' && index === 0)){
        item.classList.add('active');
        currentIndex = index;
    } else {
        item.classList.remove('active');
    }
});

// Update indicator after a short delay to ensure correct positioning
setTimeout(() => {
    const active = document.querySelector('.list.active');
    if(active) updateIndicator(active);
}, 100);
</script>
</body>
</html>
