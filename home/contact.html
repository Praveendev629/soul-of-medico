<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Soul of Medico</title>
    <link rel="icon" type="image/jpeg" href="../assets/logo.jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="nav.css">
</head>
<body class="bg-blue-50 text-blue-900 min-h-screen">
    <!-- Firebase Auth Check -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="../firebase-config.js"></script>
    <script>
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = '../signin.html';
            }
        });
    </script>

    <div class="container mx-auto px-4 py-10">
        <h1 class="text-3xl font-bold text-center mb-6">Contact Us</h1>
        <div class="bg-white rounded-xl shadow-lg p-8 max-w-3xl mx-auto">
            <p class="text-lg mb-4">Need help with your NEET prep? Reach out to our team.</p>
            <div class="grid gap-6 md:grid-cols-2">
                <div class="rounded-lg border border-blue-200 p-5">
                    <h2 class="text-xl font-semibold mb-2">Email</h2>
                    <p class="text-blue-700">support@soul-of-medico.com</p>
                </div>
                <div class="rounded-lg border border-blue-200 p-5">
                    <h2 class="text-xl font-semibold mb-2">Phone</h2>
                    <p class="text-blue-700">+91 98765 43210</p>
                </div>
            </div>
            <div class="mt-8">
                <h2 class="text-xl font-semibold mb-3">Message</h2>
                <textarea class="w-full border border-blue-200 rounded-lg p-3 focus:ring-2 focus:ring-blue-300" rows="5" placeholder="Write your message here..."></textarea>
                <button class="mt-4 bg-blue-600 text-white px-5 py-3 rounded-lg hover:bg-blue-700">Send Message</button>
            </div>
        </div>
    </div>

    <div class="page-nav-stage">
        <div class="page-nav-box">
            <div class="tabbar tab-style1">
                <ul class="flex-center">
                    <li class="nav-home" data-page="home"><a href="home.html"><span class="material-icons-outlined">home</span></a></li>
                    <li class="nav-mocktest" data-page="mocktest"><a href="mocktest.html"><span class="material-icons-outlined">assignment</span></a></li>
                    <li class="nav-notes" data-page="notes"><a href="notes.html"><span class="material-icons-outlined">description</span></a></li>
                    <li class="nav-ai" data-page="ai"><a href="ai.html"><span class="material-icons-outlined">smart_toy</span></a></li>
                    <li class="nav-contact" data-page="contact"><a href="contact.html"><span class="material-icons-outlined">help_outline</span></a></li>
                    <li class="follow">&nbsp;</li>
                </ul>
            </div>
        </div>
    </div>
    <script src="nav.js"></script>
</body>
</html>
