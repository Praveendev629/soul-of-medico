<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background-color: #b8e4f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: absolute;
    width: 180px; height: 180px;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
    top: -40px; left: -40px;
  }
  body::after {
    content: '';
    position: absolute;
    width: 120px; height: 120px;
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    bottom: 30px; right: 60px;
  }

  .card {
    background: #f7fcfd;
    border-radius: 24px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    width: 100%;
    max-width: 340px;
    position: relative;
    z-index: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .floral-area {
    width: 100%;
    background: #f7fcfd;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 36px 0 24px;
    position: relative;
  }

  .dot {
    position: absolute;
    border-radius: 50%;
    background: #b8e4f0;
  }

  .sign-in-area {
    width: 100%;
    padding: 8px 40px 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .sign-in-area h2 {
    font-size: 24px;
    font-weight: 800;
    color: #1a1a2e;
    text-align: center;
  }

  .sign-in-area .subtitle {
    font-size: 13px;
    color: #8a8a9a;
    text-align: center;
    margin-top: -10px;
  }

  .btn-google {
    width: 100%;
    padding: 13px 20px;
    border: none;
    border-radius: 30px;
    background: #a8d8e8;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #1a3a4a;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 2px 10px rgba(100,180,210,0.3);
    margin-top: 4px;
  }
  .btn-google:hover {
    background: #8ec8dc;
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(100,180,210,0.4);
  }
  .btn-google:active { transform: translateY(0); }

  .login-link {
    font-size: 12px;
    color: #8a8a9a;
    text-align: center;
  }
  .login-link a {
    color: #5a9ab0;
    font-weight: 700;
    text-decoration: none;
  }
  .login-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">

  <!-- FLORAL TOP -->
  <div class="floral-area">
    <div class="dot" style="width:12px;height:12px;top:20px;left:28px;opacity:0.8;"></div>
    <div class="dot" style="width:7px;height:7px;top:42px;left:48px;opacity:0.5;"></div>
    <div class="dot" style="width:9px;height:9px;top:18px;right:38px;opacity:0.6;"></div>

    <img src="assets/login.png" alt="Login Image" style="width: 250px; height: 250px; object-fit: contain;">
  </div>

  <!-- SIGN IN CONTENT -->
  <div class="sign-in-area">
    <h2>Sign in</h2>
    <p class="subtitle">Create an account, it's free</p>

    <button class="btn-google" onclick="handleFirebaseSignIn()">
      <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Sign in with Google
    </button>

    <p class="login-link" onclick="handleLoginLink()">Already have an account? <a href="#">Log in</a></p>
  </div>

</div>

<!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    
    <script>
        console.log('Firebase initialized successfully');

        // Check if user is already signed in
        auth.onAuthStateChanged((user) => {
            if (user) {
                console.log('User already signed in:', user.displayName);
                alert('Already signed in as ' + user.displayName + '. Redirecting to home...');
                window.location.href = 'home/home.html';
            }
        });

        function handleFirebaseSignIn() {
            console.log('Initiating Firebase Sign In with Google...');
            
            // Show loading state
            const btn = document.querySelector('.btn-google');
            const originalContent = btn.innerHTML;
            btn.innerHTML = `
                <div class="flex items-center justify-center">
                    <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-gray-600 mr-2"></div>
                    Connecting to Firebase...
                </div>
            `;
            btn.disabled = true;
            
            // Configure Google Provider
            const provider = new firebase.auth.GoogleAuthProvider();
            
            // Use local persistence so the user remains signed in across refreshes and browser restarts
            auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
                .then(() => auth.signInWithPopup(provider))
                .then((result) => {
                    console.log('Firebase Google Sign In successful:', result.user);
                    alert('Welcome to Soul of Medico, ' + result.user.displayName + '!');
                    // Navigate to home page
                    window.location.href = 'home/home.html';
                })
                .catch((error) => {
                    console.error('Firebase Sign In error:', error);
                    alert('Sign In failed: ' + error.message);
                    
                    // Restore button state
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                });
        }

        function handleLoginLink() {
            console.log('Navigate to login page...');
            // For demo, show message
            alert('Email/Password login will be created next!');
            // window.location.href = '/login.html';
        }

        // Initialize particles on load
        // createParticles();
    </script>

</body>
</html>
